name: PTCG scheduled benchmark

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run fixed-condition benchmark and release gate
        run: npm run benchmark:scheduled -- artifacts/ptcg-release-gate
      - name: Publish independent review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptcg-release-gate-${{ github.run_id }}
          path: artifacts/ptcg-release-gate/
          retention-days: 90
