name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:eslint
      - run: npm run typecheck
      - run: npm test
      - name: Reproducible benchmark smoke release gate
        run: npm run benchmark:smoke -- artifacts/ptcg-release-gate
        env:
          BENCHMARK_GENERATED_AT: '2026-07-20T00:00:00.000Z'
      - name: Upload benchmark gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptcg-release-gate-smoke
          path: artifacts/ptcg-release-gate/
          retention-days: 30
