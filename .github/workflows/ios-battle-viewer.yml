name: iOS Battle Viewer

on:
  pull_request:
    paths:
      - "ios/PTCGBattleViewer/**"
      - ".github/workflows/ios-battle-viewer.yml"
  push:
    branches: [main]
    paths:
      - "ios/PTCGBattleViewer/**"
      - ".github/workflows/ios-battle-viewer.yml"

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build app and run XCTest
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/PTCGBattleViewer/PTCGBattleViewer.xcodeproj \
            -scheme PTCGBattleViewer \
            -destination 'platform=macOS,arch=arm64'
