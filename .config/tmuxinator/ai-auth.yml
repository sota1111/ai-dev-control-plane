name: ai-auth
root: /workspaces/ai-dev-control-plane
windows:
  - claude:
      panes:
        - echo "=== Claude 起動・MCP設定 ===" && echo "claudeを起動後、/mcp を実行してLinearを選択してください" && claude
  - antigravity:
      panes:
        - echo "=== Antigravity 認証 ===" && agy
  - antigravity-mcp:
      panes:
        - >-
          echo "=== Antigravity (agy) MCP Linear 認証 ===" &&
          mkdir -p ~/.gemini/config &&
          { [ -f ~/.gemini/config/mcp_config.json ] && echo "既存の ~/.gemini/config/mcp_config.json を使用（上書きしません）" || printf '%s\n' '{ "mcpServers": { "linear": { "command": "npx", "args": ["-y", "mcp-remote", "https://mcp.linear.app/mcp"] } } }' > ~/.gemini/config/mcp_config.json; } &&
          echo "MCP設定: ~/.gemini/config/mcp_config.json" &&
          echo "再認証したい場合は rm -rf ~/.mcp-auth 後に再実行してください" &&
          echo "ブラウザで Linear 認証を完了後、agy を起動し /mcp で linear が表示されれば設定完了です" &&
          npx -y mcp-remote https://mcp.linear.app/mcp
  - codex:
      panes:
        - echo "=== Codex 認証 ===" && codex
  - codex-mcp:
      panes:
        - echo "=== Codex MCP Linear 認証 ===" && codex mcp login linear
  - gh:
      panes:
        - echo "=== GitHub CLI 認証 ===" && GH_BROWSER=echo gh auth login --hostname github.com --git-protocol https --web
  - azure:
      panes:
        - echo "=== Azure CLI 認証（デバイスコード） ===" && az login --use-device-code
  - gcloud:
      panes:
        - echo "=== gcloud 認証 ===" && gcloud auth login --no-launch-browser
  - gcloud-adc:
      panes:
        - >-
          echo "=== gcloud ADC認証（ADCが失効・削除された場合のみ実行） ===" && echo "注意: ~/.config/gcloud/application_default_credentials.json が存在し有効な場合は実行不要" && gcloud auth application-default login --no-launch-browser
