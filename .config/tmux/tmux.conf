# tmux 設定 — マウス操作を有効化
#
# マウスクリックで window / pane を選択できるようにする。
# `mouse on` により以下がまとめて有効になる:
#   - ステータスバーの window 名クリックで window 切り替え
#   - pane クリックでフォーカス切り替え
#   - pane 境界ドラッグでサイズ変更
#   - ホイールでスクロール（copy-mode に入る）
#
# このファイルはリポジトリの .config/tmux/ に置かれ、実行時に bind-mount される。
# Dockerfile が ~/.tmux.conf からここへシンボリックリンクを張るため、
# tmux 起動時に自動で読み込まれる（tmuxinator の設定と同じ仕組み）。
set -g mouse on
